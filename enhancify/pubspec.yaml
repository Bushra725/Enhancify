name: enhancify
description: Enhancify - AI photo enhancer, AI photos and AI filters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.1.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  gal: ^2.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#6E0F2A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
