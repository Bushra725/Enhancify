name: enhancify
description: Enhancify - AI photo enhancer, AI photos and AI filters.
publish_to: 'none'
version: 1.8.3+15

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  gal: ^2.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^9.1.0
  image: ^4.10.1
  google_mlkit_face_detection: ^0.15.1
  # Same ML Kit family as face detection (google_mlkit_commons ^0.13).
  google_mlkit_selfie_segmentation: ^0.12.1
  file_picker: 10.3.9
  path_drawing: ^1.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/launcher_icon_source/icon.png
  adaptive_icon_background: tool/launcher_icon_source/icon_background.png
  adaptive_icon_foreground: tool/launcher_icon_source/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.webp
    - assets/stickers/cute/
    - assets/stickers/love/
    - assets/stickers/flowers/
    - assets/stickers/paper/
    - assets/stickers/doodles/
    - assets/stickers/food/
    - assets/stickers/words/
    - assets/backgrounds/
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes.ttf
    - family: Sacramento
      fonts:
        - asset: assets/fonts/Sacramento.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: AmaticSC
      fonts:
        - asset: assets/fonts/AmaticSC.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue.ttf
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous.ttf
    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/PermanentMarker.ttf
    - family: ShadowsIntoLight
      fonts:
        - asset: assets/fonts/ShadowsIntoLight.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: IndieFlower
      fonts:
        - asset: assets/fonts/IndieFlower.ttf
    - family: AbrilFatface
      fonts:
        - asset: assets/fonts/AbrilFatface.ttf
    - family: Monoton
      fonts:
        - asset: assets/fonts/Monoton.ttf
    - family: Parisienne
      fonts:
        - asset: assets/fonts/Parisienne.ttf
    - family: GloriaHallelujah
      fonts:
        - asset: assets/fonts/GloriaHallelujah.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins.ttf
        - asset: assets/fonts/PoppinsBold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplayItalic.ttf
          style: italic
